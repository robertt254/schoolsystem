services:
  - type: web
    name: cbc-school-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cbc-school-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Password for the auto-seeded first admin account. Read it from the
      # service's Environment tab after the first deploy, then change it via
      # the change-password endpoint once logged in.
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://cbc-school-system.onrender.com
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: cbc-school-db
    plan: free
    databaseName: cbcschooldb
    user: cbcuser
